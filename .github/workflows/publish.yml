name: publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          if npm view "$(npm pkg get name | tr -d '"')@$(npm pkg get version | tr -d '"')" version > /dev/null 2>&1; then
            echo "This version is already on npm."
          else
            npm publish --access public --provenance
          fi
